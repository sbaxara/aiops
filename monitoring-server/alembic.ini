#
# Alembic settings for developers (alembic revision / history). Apply migrations with
# `python manage.py migrate`, which also picks up plugin migration folders.
# The database URL comes only from the DATABASE_URL environment variable.
[alembic]
script_location = axara/community/database/migrations
prepend_sys_path = .
# Core branch only; `python manage.py migrate` adds the branches of installed plugins.
# New core revision:  alembic revision --head core@head -m "..."
version_path_separator = space
version_locations = %(here)s/axara/community/database/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
