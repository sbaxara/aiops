# HTTP — redirect all traffic to HTTPS
server {
    listen 80;
    server_name aid;
    return 301 https://$host$request_uri;
}

 # HTTPS — main server
server {
    listen 443 ssl;
    server_name aid;
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificate — mount ./certs into the container via docker-compose
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
 
    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # React Router — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to monitoring server
    location /api/ {
        proxy_pass https://monitoring-server:9090;
        proxy_ssl_verify off;                          # self-signed cert on backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Branding assets — logo, favicon, custom.css, branding.json.
    # Mount ./branding on the host to ./usr/share/nginx/branding in compose.
    # Files served here are loaded dynamically by Layout.jsx at runtime so
    # customers can swap assets without rebuilding the dashboard image.
    location /branding/ {
        alias /usr/share/nginx/branding/;
        expires 1h;                          # short TTL so changes propagate quickly
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;                 # 404 if file absent — JS handles gracefully
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}